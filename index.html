<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#eef3ff">
  <title>Magic Dictionary - Home</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: Inter, Arial, Helvetica, sans-serif;
      --navy: #06145e;
      --ink: #111b2f;
    }

    * { box-sizing: border-box; }

    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 10% 12%, rgba(255,255,255,.95) 0 1.5px, transparent 1.8px),
        radial-gradient(circle at 88% 18%, rgba(255,255,255,.8) 0 1.5px, transparent 1.8px),
        radial-gradient(circle at 18% 76%, rgba(255,255,255,.75) 0 1.5px, transparent 1.8px),
        radial-gradient(circle at 76% 82%, rgba(255,255,255,.8) 0 1.5px, transparent 1.8px),
        linear-gradient(135deg, #edf6ff 0%, #f5f5fb 48%, #edf6ff 100%);
      background-size: 120px 120px, 180px 180px, 150px 150px, 210px 210px, auto;
      color: var(--ink);
    }

    .shell {
      width: min(620px, calc(100% - 32px));
      height: 100vh;
      margin: 0 auto;
      padding-top: 104px;
      display: grid;
      grid-template-rows: auto auto minmax(0, 1fr);
    }

    h1 {
      margin: 0 0 34px;
      color: var(--navy);
      font-size: clamp(38px, 7vw, 52px);
      line-height: 1;
      font-weight: 800;
      letter-spacing: -2.5px;
      text-align: center;
      text-shadow: 0 1px 0 rgba(255,255,255,.8);
    }

    .search-form {
      display: flex;
      align-items: center;
      width: 100%;
      height: 68px;
      margin-bottom: 40px;
      padding: 7px 8px 7px 31px;
      border: 1px solid rgba(255,255,255,.92);
      border-radius: 38px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 18px 32px rgba(54,75,125,.15), 0 5px 12px rgba(54,75,125,.10);
    }

    .search-input {
      flex: 1;
      min-width: 0;
      height: 100%;
      padding: 0;
      border: 0;
      outline: 0;
      background: transparent;
      color: #161b25;
      font: 500 22px/1 Inter, Arial, sans-serif;
    }

    .search-input::placeholder { color: #a1a4ac; opacity: 1; }

    .search-icon {
      display: grid;
      flex: 0 0 36px;
      place-items: center;
      width: 36px;
      height: 36px;
      margin-right: 8px;
      border: 0;
      background: transparent;
      color: #4f596c;
      cursor: pointer;
    }

    .search-icon svg { width: 29px; height: 29px; }

    .search-button {
      flex: 0 0 122px;
      height: 54px;
      border: 0;
      border-radius: 29px;
      background: #1a2f62;
      color: #fff;
      font: 500 21px/1 Inter, Arial, sans-serif;
      cursor: pointer;
      transition: transform .15s ease, background .15s ease;
    }

    .search-button:hover { background: #102450; }
    .search-button:active { transform: scale(.97); }

    .results {
      min-height: 0;
      margin-bottom: 48px;
      overflow-y: auto;
      overflow-x: hidden;
      overscroll-behavior: contain;
      padding: 54px 56px 48px;
      border: 1px solid rgba(255,255,255,.96);
      border-radius: 22px;
      background: rgba(255,255,255,.96);
      box-shadow: 0 24px 38px rgba(54,75,125,.16), 0 8px 16px rgba(54,75,125,.07);
      scrollbar-width: thin;
      scrollbar-color: #aebcff #edf2ff;
    }

    .results::-webkit-scrollbar { width: 11px; }
    .results::-webkit-scrollbar-track { background: #edf2ff; border-radius: 999px; }
    .results::-webkit-scrollbar-thumb { background: #aebcff; border: 2px solid #edf2ff; border-radius: 999px; }
    .results::-webkit-scrollbar-thumb:hover { background: #8fa3ed; }

    .result-content { max-width: 100%; }

    .word-row {
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 21px;
    }

    .word-row h2 {
      margin: 0;
      color: #09174f;
      font-size: 48px;
      line-height: 1;
      font-weight: 800;
      letter-spacing: -1.5px;
      overflow-wrap: anywhere;
    }

    .phonetic {
      margin: 0;
      color: #4c5667;
      font-size: 21px;
      line-height: 1.2;
    }

    .part-of-speech {
      margin: 20px 0 12px;
      color: #191e27;
      font-size: 20px;
      line-height: 1.2;
      font-style: italic;
      font-weight: 500;
    }

    .definitions {
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: definition;
    }

    .definitions li {
      position: relative;
      margin: 0 0 20px;
      padding-left: 30px;
      color: #111;
      font-size: 19px;
      line-height: 1.38;
      counter-increment: definition;
      overflow-wrap: anywhere;
    }

    .definitions li::before {
      content: counter(definition) ".";
      position: absolute;
      left: 0;
    }

    .example {
      display: block;
      margin-top: 4px;
      color: #555;
      font-style: italic;
    }

    .google-link {
      display: inline-block;
      margin-top: 8px;
      color: #10285a;
      font-size: 18px;
      font-weight: 600;
      text-decoration-thickness: 1.5px;
      text-underline-offset: 3px;
    }

    .status { margin: 0; color: #626b7a; font-size: 18px; line-height: 1.5; }
    .status.error { color: #9c1717; }

    @media (max-width: 600px) {
      .shell { width: calc(100% - 28px); padding-top: 62px; }
      h1 { margin-bottom: 25px; font-size: 36px; letter-spacing: -2px; }
      .search-form { height: 62px; margin-bottom: 25px; padding-left: 22px; }
      .search-input { font-size: 19px; }
      .search-icon { display: none; }
      .search-button { flex-basis: 105px; height: 50px; font-size: 18px; }
      .results { margin-bottom: 24px; padding: 38px 28px; border-radius: 18px; }
      .word-row h2 { font-size: 38px; }
      .definitions li { font-size: 17px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <h1>Magic Dictionary</h1>

    <form class="search-form" id="search-form" role="search">
      <input class="search-input" id="word-input" name="word" type="search" value="Dictionary" placeholder="Search a word" aria-label="Search for an English word" autocomplete="off" required>
      <button class="search-icon" type="submit" aria-label="Search">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round">
          <circle cx="10.8" cy="10.8" r="6.8"></circle>
          <path d="M16 16l5 5"></path>
        </svg>
      </button>
      <button class="search-button" type="submit">Search</button>
    </form>

    <section class="results" id="results" aria-live="polite" aria-busy="false">
      <div class="result-content" id="result-content"></div>
    </section>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('word-input');
    const result = document.getElementById('result-content');
    const resultsPanel = document.getElementById('results');

    function setStatus(message, isError = false) {
      result.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.className = isError ? 'status error' : 'status';
      paragraph.textContent = message;
      result.append(paragraph);
    }

    async function lookup(word) {
      if (!word) return;
      resultsPanel.scrollTo({ top: 0 });
      resultsPanel.setAttribute('aria-busy', 'true');
      setStatus(`Looking up “${word}”…`);

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!response.ok) {
          if (response.status === 404) throw new Error(`No English definition found for “${word}”. Check the spelling and try again.`);
          throw new Error('The dictionary is temporarily unavailable. Please try again.');
        }

        const entries = await response.json();
        const entry = entries[0];
        result.replaceChildren();

        const wordRow = document.createElement('div');
        wordRow.className = 'word-row';
        const heading = document.createElement('h2');
        heading.textContent = entry.word || word;
        wordRow.append(heading);

        const phonetic = entry.phonetic || entry.phonetics?.find(item => item.text)?.text;
        if (phonetic) {
          const phoneticText = document.createElement('p');
          phoneticText.className = 'phonetic';
          phoneticText.textContent = phonetic;
          wordRow.append(phoneticText);
        }
        result.append(wordRow);

        let definitionCount = 0;
        for (const meaning of entry.meanings || []) {
          const definitions = (meaning.definitions || []).filter(item => item.definition);
          if (!definitions.length) continue;

          const part = document.createElement('h3');
          part.className = 'part-of-speech';
          part.textContent = meaning.partOfSpeech || 'Meaning';
          result.append(part);

          const list = document.createElement('ol');
          list.className = 'definitions';
          for (const item of definitions) {
            const listItem = document.createElement('li');
            listItem.textContent = item.definition;
            if (item.example) {
              const example = document.createElement('span');
              example.className = 'example';
              example.textContent = `“${item.example}”`;
              listItem.append(example);
            }
            list.append(listItem);
            definitionCount++;
          }
          result.append(list);
        }

        if (!definitionCount) {
          setStatus(`No English definition found for “${word}”. Check the spelling and try again.`, true);
          return;
        }

        const googleLink = document.createElement('a');
        googleLink.className = 'google-link';
        googleLink.href = `https://www.google.com/search?q=${encodeURIComponent(`${word} meaning`)}`;
        googleLink.target = '_blank';
        googleLink.rel = 'noopener noreferrer';
        googleLink.textContent = `Search “${word}” on Google`;
        result.append(googleLink);
      } catch (error) {
        setStatus(error.message || 'Something went wrong while looking up that word. Please try again.', true);
      } finally {
        resultsPanel.setAttribute('aria-busy', 'false');
      }
    }

    form.addEventListener('submit', event => {
      event.preventDefault();
      lookup(input.value.trim());
    });

    lookup('Dictionary');
  </script>
</body>
</html>

<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#b8ff70">
  <title>Magic Dictionary</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      color-scheme: light;
      font-family: Arial, Helvetica, sans-serif;
      background: #b8ff70;
      color: #080808;
      scrollbar-width: none;
    }

    * { box-sizing: border-box; }
    html, body { overflow-x: hidden; scrollbar-width: none; }
    html::-webkit-scrollbar, body::-webkit-scrollbar { display: none; }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 21px 5.65% 26px;
      background: #b8ff70;
    }

    .site-title {
      display: block;
      width: fit-content;
      max-width: 100%;
      margin: 0 auto 13px;
      color: #1600c9;
      font-family: "Orbitron", Arial, sans-serif;
      font-size: clamp(25px, 4.45vw, 46px);
      font-weight: 700;
      letter-spacing: .075em;
      line-height: 1.25;
      text-align: center;
      text-decoration: none;
      white-space: nowrap;
    }

    .search-form {
      display: flex;
      width: min(530px, 100%);
      height: 44px;
      margin: 0 auto 23px;
      overflow: hidden;
      border: 3px solid #080808;
      border-radius: 32px;
      background: #fff;
    }

    .search-input {
      flex: 1;
      min-width: 0;
      padding: 3px 18px;
      border: 0;
      outline: 0;
      background: transparent;
      color: #111;
      font: 22px Arial, Helvetica, sans-serif;
    }

    .search-input::placeholder { color: #aaa; opacity: 1; }
    .search-input::-webkit-search-cancel-button { cursor: pointer; }

    .results {
      width: 100%;
      min-height: min(571px, calc(100vh - 185px));
      padding: clamp(20px, 4vw, 48px);
      overflow-wrap: anywhere;
      border: 3px solid #080808;
      border-radius: 20px;
      background: #fff;
    }

    .result-content { max-width: 900px; margin: 0 auto; }
    .result-content h2 { margin: 0 0 18px; font-size: clamp(25px, 4vw, 34px); }
    .result-content h3 { margin: 24px 0 8px; font-size: 20px; }
    .result-content p, .result-content li { font-size: 18px; line-height: 1.55; }
    .result-content p { margin: 8px 0; }
    .result-content ol { padding-left: 26px; }
    .result-content a { color: #1600a8; }
    .status { margin: 0; font-size: 18px; line-height: 1.5; }
    .status.error { color: #9c1717; }

    @media (max-width: 600px) {
      body { padding: 20px 5% 22px; }
      .site-title { margin-bottom: 16px; letter-spacing: .035em; }
      .search-form { height: 40px; margin-bottom: 18px; }
      .search-input { font-size: 19px; }
      .results { min-height: calc(100vh - 166px); border-radius: 16px; }
    }
  </style>
</head>
<body>
  <header>
    <a class="site-title" href="index.html">MAGIC DICTIONARY</a>
    <form class="search-form" id="search-form" role="search">
      <input class="search-input" id="word-input" name="word" type="search" placeholder="search" aria-label="Search for an English word" autocomplete="off" required>
    </form>
  </header>

  <main class="results" id="results" aria-live="polite" aria-busy="false">
    <div class="result-content" id="result-content"></div>
  </main>

  <script>
    const form = document.getElementById('search-form');
    const input = document.getElementById('word-input');
    const result = document.getElementById('result-content');
    const resultsPanel = document.getElementById('results');

    function setStatus(message, isError = false) {
      result.replaceChildren();
      const paragraph = document.createElement('p');
      paragraph.className = isError ? 'status error' : 'status';
      paragraph.textContent = message;
      result.append(paragraph);
    }

    form.addEventListener('submit', async (event) => {
      event.preventDefault();
      const word = input.value.trim();
      if (!word) return;

      resultsPanel.setAttribute('aria-busy', 'true');
      setStatus(`Looking up “${word}”…`);

      try {
        const response = await fetch(`https://api.dictionaryapi.dev/api/v2/entries/en/${encodeURIComponent(word)}`);
        if (!response.ok) {
          if (response.status === 404) throw new Error(`No English definition found for “${word}”. Check the spelling and try again.`);
          throw new Error('The dictionary is temporarily unavailable. Please try again.');
        }

        const entries = await response.json();
        const entry = entries[0];
        result.replaceChildren();

        const heading = document.createElement('h2');
        heading.textContent = entry.word || word;
        result.append(heading);

        const phonetic = entry.phonetic || entry.phonetics?.find(item => item.text)?.text;
        if (phonetic) {
          const pronunciation = document.createElement('p');
          pronunciation.textContent = phonetic;
          result.append(pronunciation);
        }

        let definitionCount = 0;
        for (const meaning of entry.meanings || []) {
          const definitions = (meaning.definitions || []).filter(item => item.definition);
          if (!definitions.length) continue;
          definitionCount += definitions.length;

          const partOfSpeech = document.createElement('h3');
          partOfSpeech.textContent = meaning.partOfSpeech || 'Meaning';
          result.append(partOfSpeech);

          const list = document.createElement('ol');
          for (const item of definitions) {
            const listItem = document.createElement('li');
            listItem.textContent = item.definition;
            list.append(listItem);
          }
          result.append(list);
        }

        if (!definitionCount) {
          setStatus(`No English definition found for “${word}”. Check the spelling and try again.`, true);
        }

        const googleLink = document.createElement('p');
        const link = document.createElement('a');
        link.href = `https://www.google.com/search?q=${encodeURIComponent(`${word} meaning`)}`;
        link.target = '_blank';
        link.rel = 'noopener noreferrer';
        link.textContent = `Search “${word}” on Google`;
        googleLink.append(link);
        result.append(googleLink);
      } catch (error) {
        setStatus(error.message || 'Something went wrong while looking up that word. Please try again.', true);
      } finally {
        resultsPanel.setAttribute('aria-busy', 'false');
      }
    });
  </script>
</body>
</html>
